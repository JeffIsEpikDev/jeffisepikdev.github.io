flash(p.intent=='yes'?`#${n} ${p.name} verified`:`#${n} ${p.name} voted (${p.intent=='no'?'said no':'not asked'})`,p.intent=='yes'?'good':'bad');if(navigator.vibrate)navigator.vibrate(30)}
function render(){$('#main').innerHTML=pages[page]();const al=allowed();$('#tabs').hidden=al.length<2;$('#tabs').innerHTML=al.map(k=>`<a href="#${k}" class="${k==page?'on':''}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${LABELS[k]}</a>`).join('');
$('#top').innerHTML=`<span>${esc(user)}</span><button data-a=out>Sign out</button>`;
if(page=='list')paintRows();if(page=='entries')paintLog();if(page=='settings')paintLinks()}
function paintLinks(){$('#lks').innerHTML=S.links.map((u,i)=>`<div class=lk><span>${esc(u)}</span><button class="btn s" data-a=load data-i=${i} style="min-height:44px;padding:0 14px">Load</button><button class=x data-a=rmlink data-i=${i}>×</button></div>`).join('')}
// ---- importing ----
function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
function toCsv(u){const g=(u.match(/[#&?]gid=(\d+)/)||[])[1],gq=g?'&gid='+g:'';if(/\/d\/e\//.test(u))return u.split('?')[0].replace('pubhtml','pub')+'?output=csv'+gq;const m=u.match(/docs\.google\.com\/spreadsheets\/d\/([^/?#]+)/);return m?`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv${gq}`:u}
const norm=v=>/^\s*y/i.test(v)?'yes':/^\s*n/i.test(v)?'no':'';
function merge(rows){const hi=rows.findIndex(r=>r.some(c=>/^name$/i.test(String(c).trim())));if(hi<0)throw Error('No “Name” column found');
const h=rows[hi].map(c=>String(c).trim().toLowerCase()),f=re=>h.findIndex(c=>re.test(c)),ix={no:f(/^(#|no\.?|number)$/),name:f(/^name$/),nid:f(/national|id/),isl:f(/island/),adr:f(/address/),sex:f(/^sex|gender/),it:f(/call|vote|intent|yes/)};
if(ix.it<0&&ix.sex>=0)ix.it=ix.sex+1;if(ix.no<0)throw Error('No “#” column found');
const m=by();let add=0,upd=0;for(const r of rows.slice(hi+1)){const no=Number(r[ix.no]),name=String(r[ix.name]||'').replace(/\s+/g,' ').trim();if(!no||!name)continue;
const o={no,name,nid:ix.nid<0?'':String(r[ix.nid]||''),island:ix.isl<0?'':String(r[ix.isl]||''),address:ix.adr<0?'':String(r[ix.adr]||''),sex:ix.sex<0?'':String(r[ix.sex]||''),intent:ix.it<0?'':norm(String(r[ix.it]||''))};
const p=m.get(no);if(p){Object.assign(p,{name:o.name,nid:o.nid||p.nid,address:o.address||p.address});if(!p.intent&&o.intent)p.intent=o.intent;upd++}else{S.voters.push(o);add++}}
S.voters.sort((a,b)=>a.no-b.no);save();return`${add} added, ${upd} updated`}
async function loadLink(i){toast('Loading…');try{const r=await fetch(toCsv(S.links[i]));if(!r.ok)throw Error('HTTP '+r.status);toast(merge(parseCSV(await r.text()))+'');render()}catch(e){toast('Could not load link ('+e.message+'). Make sure it is shared, or upload the file instead.')}}
async function loadFile(f){try{let rows;if(/\.csv$/i.test(f.name))rows=parseCSV(await f.text());else{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(Error('needs internet once to read .xlsx'));document.head.appendChild(s)});const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}toast(merge(rows));render()}catch(e){toast('Import failed: '+e.message)}}
// ---- events ----
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,no=+b.dataset.no,i=+b.dataset.i;
if(a=='set'){const p=by().get(no),v=b.dataset.v;p.intent=p.intent==v?'':v;save();paintRows();document.querySelectorAll('.chips button').forEach(x=>{const s=stats();const n={all:['All',s.total],yes:['Yes',s.yes],no:['No',s.no],un:['Not asked',s.unset]}[x.dataset.v];x.textContent=n.join(' ')})}
else if(a=='flt'){flt=b.dataset.v;render()}
else if(a=='add')addEntry();
else if(a=='del'){if(confirm('Remove entry #'+no+'?')){S.entries=S.entries.filter(x=>x.no!==no);save();paintLog()}}
else if(a=='addlink'){const u=$('#lnk').value.trim();if(!/^https?:\/\//.test(u))return toast('Enter a full link starting with https://');if(!S.links.includes(u))S.links.push(u);save();$('#lnk').value='';paintLinks();loadLink(S.links.indexOf(u))}
else if(a=='load')loadLink(i);
else if(a=='rmlink'){S.links.splice(i,1);save();paintLinks()}
else if(a=='pick')$('#file').click();else if(a=='pickb')$('#bfile').click();
else if(a=='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='vote-tracker-backup.json';l.click()}
else if(a=='clear'){if(confirm('Clear ALL entries? This cannot be undone.')){S.entries=[];last=null;save();toast('Entries cleared')}}
else if(a=='out'){sessionStorage.removeItem('user');location.reload()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;paintRows()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='num'){e.preventDefault();addEntry()}});
document.addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(e.target.id=='file')loadFile(f);
if(e.target.id=='bfile'){try{const d=JSON.parse(await f.text());if(!d.voters)throw 0;S=d;save();toast('Backup restored');render()}catch(x){toast('Not a valid backup file')}}e.target.value=''});
window.addEventListener('storage',e=>{if(e.key==KEY){S=load();if(page=='list'){paintRows()}else if(page=='entries')paintLog();else render()}});
window.addEventListener('hashchange',route);
function route(){const al=allowed(),h=location.hash.slice(1);page=al.includes(h)?h:al[0];if(h!==page)history.replaceState(null,'','#'+page);render()}
function enter(){location.hash=location.hash;$('#login').hidden=true;$('#app').hidden=false;route()}
$('#lf').addEventListener('submit',e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase(),a=ACCOUNTS[em];if(a&&$('#pw').value===a.pass){user=em;sessionStorage.setItem('user',em);$('#err').textContent='';$('#pw').value='';enter()}else{$('#err').textContent='Incorrect email or passcode';$('#pw').value=''}});
if(ACCOUNTS[user])enter();
</script></body></html>
